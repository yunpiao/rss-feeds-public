name: Fetch RSS Feeds

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['feeds/**', '**.md', 'LICENSE']

permissions:
  contents: write

concurrency:
  group: rss-feed-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test feed validation
        run: make test
      - name: Fetch public RSS sources
        run: make fetch
      - name: Publish feeds and status
        if: ${{ !cancelled() && hashFiles('feeds/status.json') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/
          if ! git diff --staged --quiet; then
            git commit -m "chore(feeds): 更新订阅镜像"
            git push
          fi
